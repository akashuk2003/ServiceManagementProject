<h2>Service Services</h2>
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<a href="{% url 'service_create' %}">Add Service</a>

<form method="GET">
    <input name="name" placeholder="Search service"

    <select name="status">
        <option value="">All</option>
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
    </select>

    <button>Search</button>
</form>


{% for service in services %}
    <p>{{ service.service_name }}</p>

     <a href="{% url 'service_detail' service.pk %}">View</a>
    <a href="{% url 'service_update' service.pk %}">Edit</a>
    <a href="{% url 'service_delete' service.pk %}">Delete</a>

    {% empty %}
    <p>No services found.</p>
{% endfor %}
